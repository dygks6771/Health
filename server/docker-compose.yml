# 로컬 개발용 PostgreSQL
#   docker compose up -d
services:
  postgres:
    image: postgres:17
    container_name: health-rpg-db
    environment:
      POSTGRES_DB: healthrpg
      POSTGRES_USER: healthrpg
      POSTGRES_PASSWORD: healthrpg
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - health-rpg-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthrpg -d healthrpg"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  health-rpg-db-data:
