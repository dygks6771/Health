# 출시용 서버 묶음: PostgreSQL + 게임 서버 + Caddy(HTTPS 자동 인증서)
#   cd server/deploy
#   cp .env.example .env   (값 채우기)
#   docker compose -f docker-compose.prod.yml up -d --build
# 외부에는 Caddy 의 80/443 포트만 열림. DB 와 서버(8080)는 내부 네트워크에서만 접속 가능.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthrpg
      POSTGRES_USER: healthrpg
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 설정하세요}
      TZ: Asia/Seoul
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthrpg -d healthrpg"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/healthrpg
      DB_USERNAME: healthrpg
      DB_PASSWORD: ${DB_PASSWORD}
      # 용병 친구 모집(/api/dev/friend-bots) 사용 여부
      GAME_DEV_TOOLS: ${GAME_DEV_TOOLS:-true}
      # Caddy 뒤에서 실제 접속자 IP 로 로그인 시도 제한을 계산
      SERVER_FORWARD_HEADERS_STRATEGY: native
      TZ: Asia/Seoul

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN 을 .env 에 설정하세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
